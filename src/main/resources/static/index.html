<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Temperatures Analyzer - Monotonic Stack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bar-anim { transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-10 px-4">
<div class="max-w-3xl mx-auto space-y-6">

    <!-- Header -->
    <div class="text-center space-y-2">
        <h1 class="text-3xl font-black tracking-tight text-white flex items-center justify-center gap-2">
            <span>🌡️</span> Daily Temperatures Visualizer
        </h1>
        <p class="text-sm text-slate-400">
            Spring Boot REST API + Monotonic Stack Algorithm Demo
        </p>
    </div>

    <!-- Controls Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-4">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">
            Temperatures (Comma-separated)
        </label>

        <div class="flex flex-col sm:flex-row gap-3">
            <input
                    id="tempInput"
                    type="text"
                    value="30, 32, 31, 35, 33, 36, 34"
                    placeholder="e.g. 30, 32, 31, 35, 33, 36, 34"
                    class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
            />
            <button
                    id="analyzeBtn"
                    onclick="analyzeTemperatures()"
                    class="bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-bold px-7 py-3 rounded-xl transition duration-150 flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20"
            >
                <span id="btnText">Analyze API</span>
            </button>
        </div>

        <!-- Presets & Status -->
        <div class="flex flex-wrap items-center justify-between text-xs text-slate-400 pt-1">
            <div class="flex items-center gap-2">
                <span>Presets:</span>
                <button onclick="setPreset('30, 32, 31, 35, 33, 36, 34')" class="text-amber-400 hover:underline">Example 1</button>
                <span>•</span>
                <button onclick="setPreset('73, 74, 75, 71, 69, 72, 76, 73')" class="text-amber-400 hover:underline">LeetCode 739</button>
                <span>•</span>
                <button onclick="setPreset('30, 40, 50, 60')" class="text-amber-400 hover:underline">Strictly Increasing</button>
            </div>
            <div id="sourceBadge" class="mt-2 sm:mt-0 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-slate-800 text-slate-300">
                Connecting...
            </div>
        </div>
    </div>

    <!-- Visualization Results Section -->
    <div id="outputSection" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6">

        <!-- Metadata Row -->
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4">
            <div>
                <h2 class="text-lg font-bold text-white">Visual Result</h2>
                <p class="text-xs text-slate-400" id="resultSubtitle">7 days analyzed</p>
            </div>
            <div class="flex gap-2">
          <span id="badgeAlgo" class="px-3 py-1 text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full">
            Monotonic Stack
          </span>
                <span id="badgeComplexity" class="px-3 py-1 text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full">
            O(n)
          </span>
            </div>
        </div>

        <!-- Temperature Cards Grid -->
        <div id="cardsGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-3">
            <!-- Cards generated by JS -->
        </div>

        <!-- Interactive Highlight Banner -->
        <div id="detailBanner" class="p-4 rounded-xl bg-slate-950 border border-slate-800 text-xs flex items-center gap-3">
            <span class="text-xl" id="detailIcon">💡</span>
            <span id="detailText" class="text-slate-300">Kisi bhi card par click ya hover karein warmer day dekhne ke liye.</span>
        </div>

        <!-- Collapsible JSON -->
        <details class="text-xs bg-slate-950 p-3.5 rounded-xl border border-slate-800 text-slate-400">
            <summary class="cursor-pointer font-mono text-slate-300 hover:text-amber-400">Response JSON Data</summary>
            <pre id="jsonPreview" class="mt-2 p-3 bg-black/60 rounded-lg overflow-x-auto text-emerald-400 font-mono text-xs"></pre>
        </details>
    </div>

</div>

<script>
    let currentData = null;

    // Local Algorithm Fallback (Same as your Java Monotonic Stack)
    function calculateLocal(temperatures) {
      const n = temperatures.length;
      const answer = new Array(n).fill(0);
      const stack = [];

      for (let i = n - 1; i >= 0; i--) {
        while (stack.length > 0 && temperatures[stack[stack.length - 1]] <= temperatures[i]) {
          stack.pop();
        }
        if (stack.length > 0) {
          answer[i] = stack[stack.length - 1] - i;
        }
        stack.push(i);
      }

      return {
        temperatures: temperatures,
        waitingDays: answer,
        algorithm: "Monotonic Stack",
        timeComplexity: "O(n)"
      };
    }

    function setPreset(val) {
      document.getElementById('tempInput').value = val;
      analyzeTemperatures();
    }

    async function analyzeTemperatures() {
      const inputStr = document.getElementById('tempInput').value.trim();
      const btnText = document.getElementById('btnText');
      const sourceBadge = document.getElementById('sourceBadge');

      const temps = inputStr.split(',')
        .map(s => s.trim())
        .filter(s => s !== '')
        .map(Number);

      if (temps.length === 0 || temps.some(isNaN)) {
        alert("Kripya valid numbers enter karein (e.g. 30, 32, 31).");
        return;
      }

      btnText.textContent = "Analyzing...";

      let data = null;
      let isBackend = false;

      // 1. Pehle Spring Boot API try karega
      try {
        const response = await fetch('/api/temperatures/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ temperatures: temps })
        });

        if (response.ok) {
          data = await response.json();
          isBackend = true;
        }
      } catch (err) {
        // Backend offline ya file:/// protocol
        console.warn("Backend API unreachable, using local algorithm fallback:", err);
      }

      // 2. Agar backend offline hai, toh local fallback chalega
      if (!data) {
        data = calculateLocal(temps);
        isBackend = false;
      }

      currentData = data;

      // Status badge update
      if (isBackend) {
        sourceBadge.innerHTML = '<span class="text-emerald-400 font-bold">● Spring Boot API (Live)</span>';
      } else {
        sourceBadge.innerHTML = '<span class="text-amber-400 font-bold">● Local Engine (Backend Offline)</span>';
      }

      // Populate Meta & JSON
      document.getElementById('badgeAlgo').textContent = data.algorithm;
      document.getElementById('badgeComplexity').textContent = data.timeComplexity;
      document.getElementById('jsonPreview').textContent = JSON.stringify(data, null, 2);
      document.getElementById('resultSubtitle').textContent = `Total Days: ${data.temperatures.length}`;

      renderCards(data);
      btnText.textContent = "Analyze API";
    }

    function renderCards(data) {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      const minTemp = Math.min(...data.temperatures);
      const maxTemp = Math.max(...data.temperatures);
      const range = (maxTemp - minTemp) || 1;

      data.temperatures.forEach((temp, i) => {
        const wait = data.waitingDays[i];
        const card = document.createElement('div');
        card.className = "day-card relative flex flex-col items-center justify-between p-3 rounded-xl border border-slate-800 bg-slate-950 cursor-pointer transition-all duration-200 hover:-translate-y-1 hover:border-amber-500/60";
        card.dataset.index = i;

        const heightPct = 20 + Math.round(((temp - minTemp) / range) * 80);

        let barColor = 'bg-blue-500';
        if (temp >= 35) barColor = 'bg-rose-500';
        else if (temp >= 32) barColor = 'bg-amber-500';

        card.innerHTML = `
          <span class="text-[11px] font-mono text-slate-400">Day ${i}</span>
          <div class="my-2 flex flex-col items-center">
            <span class="text-base font-extrabold text-white">${temp}°</span>
            <div class="w-3 bg-slate-900 rounded-full h-12 flex flex-col justify-end overflow-hidden my-1">
              <div class="w-full rounded-full bar-anim ${barColor}" style="height: ${heightPct}%"></div>
            </div>
          </div>
          <div class="w-full text-center py-1 rounded text-xs font-bold ${
            wait > 0 ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-slate-900 text-slate-500'
          }">
            ${wait > 0 ? '+' + wait + 'd' : '0d'}
          </div>
        `;

        card.addEventListener('mouseenter', () => highlightDay(i));
        card.addEventListener('click', () => highlightDay(i));
        card.addEventListener('mouseleave', resetHighlights);

        grid.appendChild(card);
      });
    }

    function highlightDay(i) {
      if (!currentData) return;
      const wait = currentData.waitingDays[i];
      const targetIdx = wait > 0 ? i + wait : null;
      const allCards = document.querySelectorAll('.day-card');
      const detailText = document.getElementById('detailText');
      const detailIcon = document.getElementById('detailIcon');

      allCards.forEach((c, idx) => {
        c.classList.remove('ring-2', 'ring-amber-500', 'ring-emerald-500', 'opacity-30', 'bg-amber-500/10', 'bg-emerald-500/10');
        if (idx === i) {
          c.classList.add('ring-2', 'ring-amber-500', 'bg-amber-500/10');
        } else if (idx === targetIdx) {
          c.classList.add('ring-2', 'ring-emerald-500', 'bg-emerald-500/10');
        } else {
          c.classList.add('opacity-30');
        }
      });

      if (wait > 0) {
        detailIcon.textContent = '🎯';
        detailText.innerHTML = `<strong>Day ${i} (${currentData.temperatures[i]}°C)</strong> ke baad agla warmer din <strong>Day ${targetIdx} (${currentData.temperatures[targetIdx]}°C)</strong> hai &rarr; Wait = <span class="text-emerald-400 font-bold">${wait} din</span>.`;
      } else {
        detailIcon.textContent = '❄️';
        detailText.innerHTML = `<strong>Day ${i} (${currentData.temperatures[i]}°C)</strong> ke aage koi warmer temperature nahi hai &rarr; Wait = <span class="font-bold text-white">0 din</span>.`;
      }
    }

    function resetHighlights() {
      const allCards = document.querySelectorAll('.day-card');
      allCards.forEach(c => {
        c.classList.remove('ring-2', 'ring-amber-500', 'ring-emerald-500', 'opacity-30', 'bg-amber-500/10', 'bg-emerald-500/10');
      });
      document.getElementById('detailIcon').textContent = '💡';
      document.getElementById('detailText').textContent = 'Kisi bhi card par click ya hover karein warmer day dekhne ke liye.';
    }

    // Auto run immediately on load
    analyzeTemperatures();
</script>
</body>
</html>
